<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f9ff" />
    <script>
      // Apply saved appearance before the first paint; React owns later updates.
      try {
        // A stored preference is applied only after the server confirms a session.
        document.documentElement.dataset.siteTheme = 'default';
        const savedMode = localStorage.getItem('vsl-connect-theme');
        document.documentElement.dataset.backgroundMotion = localStorage.getItem('vsl-connect-background-motion') === 'off' ? 'off' : 'on';
        document.documentElement.classList.toggle('dark', savedMode === 'dark' || (savedMode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches));
      } catch { document.documentElement.dataset.siteTheme = 'default'; }
    </script>
    <title>VSL Connect - Ngôn ngữ Ký hiệu Việt Nam</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
